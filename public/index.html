function toggleCatchup(skipId) {
  const skip = schedule.skipped.find(s => s.id === skipId);
  if (!skip) return;
  state.catchupStatus[skipId] = skip.status === 'done' ? 'pending' : 'done';
  renderAll();
}

/* ============================================================
   JOB VIEW
   ============================================================ */
function renderJob() {
  const jobs = state.jobs;
  const totalTime = 24 * ALL_DATES.length;
  const totalSleep = 8 * ALL_DATES.length;
  const totalWork = ALL_DATES.reduce((s, d) => s + jobHours(d), 0);
  const totalUniT = ALL_DATES.reduce((s, d) => s + attendedHours(d), 0);
  const totalFreeT = totalTime - totalSleep - totalWork - totalUniT;
  const totalEarnings = totalEarningsInPeriod();
  const weeklyH = totalWeeklyHours();
  const workDaysCount = ALL_DATES.filter(isWorkDay).length;
  const monthlySalary = jobs.reduce((s, j) => s + (j.salary || 0), 0);

  if (!jobs.length) {
    document.getElementById('view-job').innerHTML = `
      <div class="card" style="text-align: center; padding: 60px 24px;">
        <div style="font-size: 40px; opacity: 0.5; margin-bottom: 16px;">💼</div>
        <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px;">No jobs added yet</div>
        <div style="color: var(--muted); font-size: 13px; max-width: 420px; margin: 0 auto 20px;">Add your jobs to see how they fit around your classes. Set your hours, days, and monthly salary — it'll automatically appear as income in Finances.</div>
        <button class="btn amber" onclick="openEditModal('jobs')">+ Add your first job</button>
      </div>`;
    return;
  }

  const jobRows = jobs.map(j => {
    const hours = j.end - j.start;
    const weekly = j.days.length * hours;
    const dayChips = [1,2,3,4,5,6,0].map(d => `<div class="job-day ${j.days.includes(d) ? 'on' : ''}">${dayLetter(d)}</div>`).join('');
    const earnings = j.salary ? `Rs. ${j.salary}/mo` : (j.rate ? `Rs. ${j.rate}/h` : '');
    return `
      <div class="job-row">
        <div class="job-color" style="background:${j.color}"></div>
        <div class="job-info">
          <div class="name">${esc(j.name)}</div>
          <div class="meta">
            <span>${fmtRange(j.start, j.end)}</span>
            <span class="sep">·</span>
            <span>${hFmt(hours)} per shift</span>
          </div>
          <div class="job-days">${dayChips}</div>
        </div>
        <div>
          <div class="job-hours-big">${hFmt(weekly)}<span class="unit">/wk</span></div>
          ${earnings ? `<div class="job-rate">${earnings}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  const upcomingHolidays = state.holidays.filter(h => daysAway(h) >= -1).sort().slice(0, 5);
  const holidayRows = upcomingHolidays.length ? upcomingHolidays.map(h => {
    const away = daysAway(h);
    const label = away === 0 ? 'Today' : away === 1 ? 'Tomorrow' : `In ${away} days`;
    const soon = away >= 0 && away <= 3;
    return `<div class="holiday-row"><div><div class="date">${fmtDateFull(h)}</div><div class="dow">Day off</div></div><div class="days-away ${soon ? 'soon' : ''}">${label}</div><div></div></div>`;
  }).join('') : '';

  const timeSplit = [
    { name:'Free time', amount: totalFreeT, color:'#86ab7a' },
    { name:'Work', amount: totalWork, color:'#e09a4e' },
    { name:'Sleep', amount: totalSleep, color:'#7ca5c4' },
    { name:'Uni', amount: totalUniT, color:'#d4745e' }
  ];

  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const jobInsights = [];
  if (jobs.length === 1) jobInsights.push({ pri: 2, importance:'normal', type:'good', icon:'💼', html:`Working <strong>${hFmt(weeklyH)}/week</strong> across ${workDaysCount} days.` });
  else jobInsights.push({ pri: 2, importance:'normal', type:'good', icon:'💼', html:`<strong>${jobs.length} jobs</strong> totalling ${hFmt(weeklyH)}/week.` });
  if (monthlySalary > 0) jobInsights.push({ pri: 2, importance:'normal', type:'good', icon:'💰', html:`Total monthly salary: <strong>${money(monthlySalary)}</strong> — auto-added to your Finances income.` });
  if (upcomingHolidays.length) {
    const away = daysAway(upcomingHolidays[0]);
    jobInsights.push({ pri: 2, importance:'normal', type:'good', icon:'🏖️', html:`Next holiday: <strong>${fmtDateFull(upcomingHolidays[0])}</strong>${away === 0 ? ' (today)' : away > 0 ? ` — ${away} day${away !== 1 ? 's' : ''} away` : ''}.` });
  }
  jobInsights.sort((a, b) => a.pri - b.pri);

  document.getElementById('view-job').innerHTML = `
    <div class="grid g-4 stagger" style="margin-bottom: 20px">
      <div class="card stat-card">
        <h2 class="job">Jobs</h2>
        <div class="stat amber"><span data-countup="${jobs.length}">0</span></div>
        <div class="stat-label">active</div>
      </div>
      <div class="card stat-card">
        <h2>Weekly hours</h2>
        <div class="stat amber"><span data-countup="${weeklyH}" data-decimal="true">0h</span></div>
        <div class="stat-label">across ${workDaysCount} shifts</div>
        <div class="spark"><div class="fill amber" style="width:${Math.min((weeklyH / 40) * 100, 100)}%"></div></div>
      </div>
      <div class="card stat-card">
        <h2>Monthly salary</h2>
        <div class="stat sage"><span data-countup="${monthlySalary}" data-money="true">Rs. 0</span></div>
        <div class="stat-label">total from all jobs</div>
      </div>
      <div class="card stat-card">
        <h2>Holidays</h2>
        <div class="stat plum"><span data-countup="${state.holidays.length}">0</span></div>
        <div class="stat-label">day${state.holidays.length !== 1 ? 's' : ''} off</div>
      </div>
    </div>
    <h2 class="section-title">Insights</h2>
    <div class="card" style="margin-bottom: 20px">
      ${jobInsights.map(i => `<div class="insight ${i.type}"><span class="icon">${i.icon}</span><span style="flex: 1;">${i.html}</span><span class="priority ${i.importance}">${i.importance}</span></div>`).join('')}
    </div>
    <h2 class="section-title">Your jobs</h2>
    <div class="card" style="margin-bottom: 20px">
      <div class="row between" style="margin-bottom: 14px">
        <h2 style="margin: 0;" class="job">Current schedule</h2>
        <button class="edit-pencil" onclick="openEditModal('jobs')" title="Edit jobs">✎</button>
      </div>
      ${jobRows}
    </div>
    <h2 class="section-title">Holidays</h2>
    <div class="card" style="margin-bottom: 20px">
      <div class="row between" style="margin-bottom: 14px">
        <h2 style="margin: 0;" class="job">Days off</h2>
        <button class="edit-pencil" onclick="openEditModal('holidays')" title="Edit holidays">✎</button>
      </div>
      ${holidayRows || '<div class="empty">No upcoming holidays.</div>'}
    </div>
    <h2 class="section-title">Analytics</h2>
    <div class="grid g-2 stagger">
      <div class="card">
        <h2>Time split</h2>
        <div class="donut-wrap">
          ${donutChart(timeSplit, 'lg', { centerText: totalTime + 'h', subText: ALL_DATES.length + ' days', thickness: 5.5 })}
          <div class="donut-legend">
            ${timeSplit.map(t => `<div class="legend-item"><div class="legend-swatch" style="background:${t.color}"></div><div class="name">${t.name}</div><div class="value">${hFmt(t.amount)} · ${Math.round((t.amount / totalTime) * 100)}%</div></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <h2>Hours worked per weekday</h2>
        ${days.map((d, i) => {
          const jsDay = (i + 1) % 7;
          const dayJobs = jobs.filter(j => j.days.includes(jsDay));
          const hours = dayJobs.reduce((s, j) => s + (j.end - j.start), 0);
          const width = hours ? Math.min((hours / 12) * 100, 100) : 0;
          return `<div class="bar-row"><div class="bar-label">${d}${!hours ? ' <span style="color:var(--muted);font-size:10px">OFF</span>' : ''}</div><div class="bar-track"><div class="bar-fill" style="width:${width}%;background:${hours ? 'linear-gradient(90deg, #e09a4e, #eab873)' : 'transparent'}">${hours ? hFmt(hours) : ''}</div></div><div class="bar-val">${hours ? hFmt(hours) : '—'}</div></div>`;
        }).join('')}
      </div>
    </div>
  `;
}

  const totalExpenses = allExpenses.reduce((s, x) => s + x.amount, 0);
  const net = totalIncome - totalExpenses;
  const savingsRate = totalIncome > 0 ? Math.round((net / totalIncome) * 100) : 0;
  const periodicTotal = state.periodic.reduce((s, x) => s + x.amount, 0);
  const variableTotal = Math.max(totalExpenses - periodicTotal, 0);

  const currentBalance = state.startingBalance + net;
  const projectedEnd = currentBalance;
  const growth = state.lastMonthBalance > 0 ? ((currentBalance - state.lastMonthBalance) / state.lastMonthBalance) * 100 : 0;
  const growthClass = growth > 0 ? 'up' : growth < 0 ? 'down' : 'flat';

        return `
          <div class="goal-row">
            <div class="goal-progress" style="--pct: ${Math.min(pct, 100)}%"><span class="pct">${pct}%</span></div>
            <div class="goal-info">
              <div class="name">${esc(g.name)}</div>
              <div class="meta">${money(g.saved)} of ${money(g.target)}${monthly ? ` · +${money(monthly)}/mo` : ''}</div>
            </div>
            <button class="btn ghost icon" onclick="removeGoalDirect('${g.id}')">✕</button>
          </div>`;
      }).join('') : `
        <div style="text-align: center; padding: 24px 12px;">
          <div style="font-size: 28px; opacity: 0.5; margin-bottom: 10px;">🎯</div>
          <div style="font-size: 12.5px; color: var(--muted); margin-bottom: 12px;">No savings goals yet.</div>
          <button class="btn plum small" onclick="openEditModal('goals')">Add savings goal</button>
        </div>
      `}
    </div>

    ${TRANSACTIONS.length ? `
    <h2 class="section-title">Recent transactions</h2>
    <div class="card">
      <div class="txn-list">
        ${TRANSACTIONS.map(t => {
          const isIncome = t.amount > 0;
          return `<div class="txn-item"><div class="txn-icon">${t.icon}</div><div class="txn-info"><div class="txn-desc">${esc(t.desc)}</div><div class="txn-meta"><span>${esc(t.cat)}</span><span>·</span><span>${esc(t.date)}</span></div></div><div class="txn-amount ${isIncome ? 'pos' : 'neg'}">${money(t.amount)}</div></div>`;
        }).join('')}
      </div>
    </div>
    ` : ''}
  `;
}

function removeGoalDirect(id) {
  state.goals = state.goals.filter(g => g.id !== id);
  renderAll();
}

function generateFinanceInsights(income, expenses, net, periodicTotal, currentBalance, projectedEnd, growth) {
  const insights = [];
  if (!income && !expenses && !state.periodic.length && !state.goals.length) {
    insights.push({ emoji: '👋', html: `<strong>Welcome to your finances.</strong> Click the pencil on either money flow card to add income and expenses.` });
    return insights;
  }
  const savingsRate = income > 0 ? Math.round((net / income) * 100) : 0;
  if (state.lastMonthBalance > 0) {
    if (growth > 5) insights.push({ emoji: '📈', html: `<strong>Your balance is up ${growth.toFixed(1)}%</strong> compared to last month.` });
    else if (growth > 0) insights.push({ emoji: '📈', html: `<strong>Balance up ${growth.toFixed(1)}% from last month.</strong>` });
    else if (growth < 0) insights.push({ emoji: '📉', html: `<strong>Balance is down ${Math.abs(growth).toFixed(1)}% from last month.</strong>` });
    else insights.push({ emoji: '➡️', html: `<strong>Balance is flat vs last month.</strong>` });
  } else {
    insights.push({ emoji: '💡', html: `<strong>Set your last month balance</strong> on the Current balance card to enable growth tracking.` });
  }
  if (income > 0) {
    if (savingsRate >= 30) insights.push({ emoji: '🎯', html: `<strong>Excellent savings rate — ${savingsRate}%.</strong>` });
    else if (savingsRate >= 15) insights.push({ emoji: '👍', html: `<strong>Solid savings rate of ${savingsRate}%.</strong>` });
    else insights.push({ emoji: '⚠️', html: `<strong>Savings rate only ${savingsRate}%.</strong> Aim for 20%.` });
  }
  if (expenses > 0 && periodicTotal > 0) {
    const recurringShare = Math.min(Math.round((periodicTotal / expenses) * 100), 100);
    insights.push({ emoji: '🔁', html: `<strong>Recurring costs are ${recurringShare}% of spending</strong> (${money(periodicTotal)}/mo).` });
  }
  const topCat = [...state.expenses].sort((a, b) => b.amount - a.amount)[0];
  if (topCat && expenses > 0) {
    const topShare = Math.round((topCat.amount / expenses) * 100);
    insights.push({ emoji: '🏠', html: `<strong>${topCat.name} is your biggest expense at ${money(topCat.amount)}</strong> — ${topShare}% of spending.` });
  }
  if (state.goals.length) {
    const g = state.goals[0];
    const pct = Math.round((g.saved / g.target) * 100);
    const remaining = g.target - g.saved;
    insights.push({ emoji: '🎓', html: `<strong>${g.name} is ${pct}% funded.</strong> At ${money(Math.max(net, 0))} saved per period, ~${net > 0 ? Math.ceil(remaining / net) : '∞'} periods to go.` });
  }
  return insights;
}

document.querySelectorAll('.nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    setTimeout(animateCountUp, 80);
  });
});

document.body.setAttribute('data-mode', state.mode || 'normal');
document.querySelectorAll('.mode-switch button').forEach(b => b.classList.toggle('active', b.dataset.mode === (state.mode || 'normal')));
renderAll();
updateConnectUI();
updateSyncIndicator();
</script>
