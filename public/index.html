<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #17140f; --bg-2: #1e1a14; --surface: #221d16; --surface-2: #2a251d;
    --surface-3: #322c22; --border: #363026; --border-hi: #4a4234;
    --text: #eee6d6; --text-dim: #b8ab98; --muted: #7a7060;
    --amber: #e09a4e; --amber-soft: rgba(224, 154, 78, 0.14);
    --sage: #86ab7a; --sage-soft: rgba(134, 171, 122, 0.14);
    --coral: #d4745e; --coral-soft: rgba(212, 116, 94, 0.14);
    --plum: #b08aba; --plum-soft: rgba(176, 138, 186, 0.14);
    --sky: #7ca5c4; --sky-soft: rgba(124, 165, 196, 0.14);
    --rose: #d68a9e; --rose-soft: rgba(214, 138, 158, 0.14);
    --r: 14px; --r-lg: 20px; --r-pill: 999px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px; line-height: 1.5; color: var(--text);
    background: var(--bg); min-height: 100vh;
    padding: 22px 24px 80px; -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(900px 500px at 15% -5%, rgba(224, 154, 78, 0.06), transparent 60%),
      radial-gradient(800px 500px at 90% 0%, rgba(134, 171, 122, 0.045), transparent 60%),
      radial-gradient(700px 500px at 50% 100%, rgba(176, 138, 186, 0.04), transparent 60%);
    background-attachment: fixed; overflow-x: hidden;
  }
  body[data-mode="basic"] { font-size: 13px; }
  .container { max-width: 1400px; margin: 0 auto; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .topbar-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .mode-switch { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-pill); }
  .mode-switch button { padding: 6px 14px; border: none; background: transparent; color: var(--text-dim); font-family: inherit; font-size: 11.5px; font-weight: 600; border-radius: var(--r-pill); cursor: pointer; transition: all 0.2s; }
  .mode-switch button:hover { color: var(--text); }
  .mode-switch button.active { background: var(--text); color: var(--bg); }
  .sync-indicator { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--border); font-size: 11px; font-weight: 600; color: var(--text-dim); transition: all 0.2s; }
  .sync-indicator.syncing { color: var(--amber); border-color: rgba(224, 154, 78, 0.3); }
  .sync-indicator.live { color: var(--sage); border-color: rgba(134, 171, 122, 0.3); }
  .sync-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .sync-indicator.syncing .dot { animation: spin 1s linear infinite; }
  .sync-indicator.live .dot { animation: pulse-dot 2s ease-in-out infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .nav-wrap { display: flex; justify-content: center; margin-bottom: 26px; }
  .nav { display: inline-flex; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-pill); box-shadow: 0 4px 20px -8px rgba(0, 0, 0, 0.5); }
  .nav button { padding: 9px 22px; border: none; background: transparent; color: var(--text-dim); font-family: inherit; font-size: 13px; font-weight: 500; border-radius: var(--r-pill); cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  .nav button:hover { color: var(--text); }
  .nav button.active { color: var(--bg); font-weight: 600; }
  .nav button[data-view="overview"].active { background: var(--text); }
  .nav button[data-view="uni"].active { background: var(--sage); color: #141d10; }
  .nav button[data-view="job"].active { background: var(--amber); color: #2a1c08; }
  .nav button[data-view="finances"].active { background: var(--plum); color: #21172a; }

  .view { display: none; }
  .view.active { display: block; }
  .view.active .stagger > * { opacity: 0; transform: translateY(12px); animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  .view.active .stagger > *:nth-child(1) { animation-delay: 0.02s; }
  .view.active .stagger > *:nth-child(2) { animation-delay: 0.06s; }
  .view.active .stagger > *:nth-child(3) { animation-delay: 0.10s; }
  .view.active .stagger > *:nth-child(4) { animation-delay: 0.14s; }
  .view.active .stagger > *:nth-child(5) { animation-delay: 0.18s; }
  .view.active .stagger > *:nth-child(6) { animation-delay: 0.22s; }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

  .grid { display: grid; gap: 16px; }
  .g-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .g-2 { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }
  .g-1-2 { grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); }
  @media (max-width: 900px) { .g-1-2 { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px 22px; transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s; position: relative; overflow: hidden; }
  .card:hover { border-color: var(--border-hi); transform: translateY(-2px); box-shadow: 0 12px 32px -20px rgba(0, 0, 0, 0.7); }
  .card h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 14px; }
  .card h2.uni { color: var(--sage); }
  .card h2.job { color: var(--amber); }
  .card h2.fin { color: var(--plum); }

  .stat-card .stat { font-size: 32px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat-card .stat small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .stat-card .stat.amber { color: var(--amber); }
  .stat-card .stat.sage { color: var(--sage); }
  .stat-card .stat.coral { color: var(--coral); }
  .stat-card .stat.plum { color: var(--plum); }
  .stat-card .stat.sky { color: var(--sky); }
  .stat-card .stat-label { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .stat-card .spark { height: 3px; border-radius: 2px; background: var(--surface-3); margin-top: 14px; overflow: hidden; }
  .stat-card .spark .fill { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
  .spark .fill.amber { background: var(--amber); }
  .spark .fill.sage { background: var(--sage); }
  .spark .fill.coral { background: var(--coral); }
  .spark .fill.plum { background: var(--plum); }
  .spark .fill.sky { background: var(--sky); }
  .growth { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-pill); margin-top: 8px; }
  .growth.up { background: var(--sage-soft); color: var(--sage); }
  .growth.down { background: var(--coral-soft); color: var(--coral); }
  .growth.flat { background: var(--surface-3); color: var(--text-dim); }
  .edit-pencil { width: 26px; height: 26px; border-radius: 50%; background: var(--bg-2); border: 1px solid var(--border); color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; padding: 0; transition: all 0.2s; flex-shrink: 0; }
  .edit-pencil:hover { background: var(--surface-3); color: var(--text); border-color: var(--border-hi); transform: rotate(-8deg); }
  .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--sage); margin-right: 5px; position: relative; vertical-align: middle; }
  .live-dot::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; background: var(--sage); animation: livePulse 2s ease-out infinite; }
  @keyframes livePulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.2); opacity: 0; } }

  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: var(--r-pill); font-size: 10px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; }
  .pill.high { background: var(--coral-soft); color: var(--coral); }
  .pill.med  { background: var(--amber-soft); color: var(--amber); }
  .pill.low  { background: var(--surface-3); color: var(--text-dim); }
  .pill.sage { background: var(--sage-soft); color: var(--sage); }
  .pill.coral { background: var(--coral-soft); color: var(--coral); }
  .pill.plum { background: var(--plum-soft); color: var(--plum); }
  .pill.sky  { background: var(--sky-soft); color: var(--sky); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.rose { background: var(--rose-soft); color: var(--rose); }

  .btn { padding: 8px 16px; border: none; border-radius: var(--r-pill); background: var(--text); color: var(--bg); font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .btn:hover { transform: translateY(-1px); opacity: 0.92; }
  .btn.amber { background: var(--amber); color: #2a1c08; }
  .btn.sage { background: var(--sage); color: #141d10; }
  .btn.plum { background: var(--plum); color: #21172a; }
  .btn.coral { background: var(--coral); color: #1a0806; }
  .btn.sky { background: var(--sky); color: #0a1a24; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .btn.ghost:hover { background: var(--surface-2); border-color: var(--border-hi); color: var(--text); }
  .btn.icon { width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 50%; }
  .btn.small { padding: 6px 12px; font-size: 11.5px; }

  .input, .select { background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 13px; color: var(--text); font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.15s, background 0.15s; width: 100%; }
  .input::placeholder { color: var(--muted); }
  .input:focus, .select:focus { border-color: var(--amber); background: var(--surface-3); }
  .select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%237a7060' stroke-width='2.5'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 11px center; padding-right: 30px; }

  .section-title { display: flex; align-items: center; gap: 12px; margin: 30px 0 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .section-title:first-child { margin-top: 0; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

  .insight { padding: 12px 15px; border-radius: 10px; background: var(--bg-2); border-left: 2px solid var(--sky); margin-bottom: 8px; font-size: 12.5px; line-height: 1.55; color: var(--text-dim); transition: transform 0.2s; display: flex; gap: 10px; align-items: flex-start; }
  .insight:hover { transform: translateX(3px); }
  .insight:last-child { margin-bottom: 0; }
  .insight.good { border-left-color: var(--sage); }
  .insight.warn { border-left-color: var(--amber); }
  .insight.bad  { border-left-color: var(--coral); }
  .insight strong { color: var(--text); font-weight: 600; }
  .insight .icon { font-size: 14px; flex-shrink: 0; line-height: 1.35; }
  .insight .priority { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; margin-left: auto; }
  .insight .priority.critical { background: var(--coral-soft); color: var(--coral); }
  .insight .priority.important { background: var(--amber-soft); color: var(--amber); }
  .insight .priority.normal { background: var(--surface-3); color: var(--text-dim); }
  .insight .priority.info { background: var(--sky-soft); color: var(--sky); }

  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .cal-month { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .cal-month .year { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-bottom: 8px; }
  .cal-weekdays div { text-align: center; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 6px 0; }
  .cal-weekdays div.weekend { color: var(--coral); opacity: 0.7; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-cell { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 11px 11px; min-height: 128px; position: relative; cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s; display: flex; flex-direction: column; }
  .cal-cell:hover { background: var(--surface-3); border-color: var(--border-hi); transform: translateY(-2px); }
  .cal-cell.other-month { opacity: 0.32; background: var(--bg-2); }
  .cal-cell.selected { border-color: var(--amber); box-shadow: 0 0 0 1.5px var(--amber), 0 8px 24px -12px rgba(224, 154, 78, 0.4); }
  .cal-cell.holiday { background: linear-gradient(180deg, rgba(176, 138, 186, 0.08), var(--surface-2)); border-color: rgba(176, 138, 186, 0.3); }
  .cal-num { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .cal-cell.weekend .cal-num { color: var(--text-dim); }
  .cal-marks { position: absolute; top: 11px; right: 11px; display: flex; gap: 3px; }
  .cal-marks .mark { width: 6px; height: 6px; border-radius: 50%; }
  .cal-marks .mark.attend { background: var(--sage); }
  .cal-marks .mark.skip { background: var(--coral); }
  .cal-marks .mark.todo { background: var(--plum); }
  .cal-marks .mark.email { background: var(--sky); }
  .cal-marks .mark.holiday { background: var(--plum); }
  .cal-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: auto; padding-top: 8px; border-top: 1px dashed rgba(255, 255, 255, 0.06); }
  .cal-stat { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.2; min-width: 0; font-variant-numeric: tabular-nums; }
  .cal-stat .stat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .cal-stat .stat-val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-stat.uni { color: #e2957f; }
  .cal-stat.uni .stat-dot { background: var(--coral); }
  .cal-stat.job { color: #eab873; }
  .cal-stat.job .stat-dot { background: var(--amber); }
  .cal-stat.sleep { color: #96b9d2; }
  .cal-stat.sleep .stat-dot { background: var(--sky); }
  .cal-stat.free { color: #a3c497; }
  .cal-stat.free .stat-dot { background: var(--sage); }
  .cal-stat.dim { opacity: 0.3; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 7px; }
  .cal-legend .swatch { width: 10px; height: 10px; border-radius: 3px; }
  .cal-legend .swatch.coral { background: var(--coral); }
  .cal-legend .swatch.amber { background: var(--amber); }
  .cal-legend .swatch.sky { background: var(--sky); }
  .cal-legend .swatch.sage { background: var(--sage); }
  .cal-legend .swatch.plum { background: var(--plum); }
  .day-detail { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); animation: cardIn 0.35s ease; }
  .day-detail-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .day-detail-title { font-size: 15px; font-weight: 700; letter-spacing: -0.015em; }
  .day-detail-sub { font-size: 12px; color: var(--muted); }
  .detail-list { display: flex; flex-direction: column; gap: 8px; }
  .detail-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; padding: 10px 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; align-items: center; transition: all 0.2s; }
  .detail-row:hover { border-color: var(--border-hi); transform: translateX(3px); }
  .detail-time { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .detail-title { font-size: 13px; font-weight: 600; }
  .detail-empty { text-align: center; padding: 24px 12px; color: var(--muted); font-size: 13px; font-style: italic; }

  .donut-wrap { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
  .donut { flex-shrink: 0; filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35)); }
  .donut-lg { width: 180px; height: 180px; }
  .donut-md { width: 140px; height: 140px; }
  .donut-sm { width: 100px; height: 100px; }
  .donut-xs { width: 76px; height: 76px; }
  .donut-circle { transition: stroke-dasharray 1s cubic-bezier(0.4, 0, 0.2, 1), stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1); }
  .donut-center { fill: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .donut-sub { fill: var(--muted); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .donut-legend { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 170px; }
  .legend-item { display: flex; align-items: center; gap: 9px; font-size: 12px; padding: 4px 0; transition: transform 0.2s; }
  .legend-item:hover { transform: translateX(2px); }
  .legend-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .legend-item .name { color: var(--text-dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-item .value { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .bar-row { display: flex; align-items: center; gap: 11px; margin-bottom: 10px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label { width: 150px; font-size: 12px; color: var(--text-dim); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 22px; background: var(--bg-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; padding-right: 9px; font-size: 10.5px; font-weight: 700; color: rgba(255, 255, 255, 0.95); transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  .bar-val { font-size: 11.5px; color: var(--text-dim); font-weight: 600; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

  .heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .heat-day { border-radius: 8px; padding: 10px 6px; text-align: center; background: var(--bg-2); border: 1px solid var(--border); transition: transform 0.2s; }
  .heat-day:hover { transform: translateY(-2px); }
  .heat-day .d { font-size: 10px; font-weight: 600; color: var(--muted); }
  .heat-day .n { font-size: 16px; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .heat-day.zero .n { color: var(--sage); }
  .heat-day.low .n { color: var(--amber); }
  .heat-day.high .n { color: var(--coral); }
  .heat-day.high { background: var(--coral-soft); border-color: rgba(212, 116, 94, 0.3); }

  .txn-list { display: flex; flex-direction: column; }
  .txn-item { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); transition: background 0.15s; border-radius: 8px; }
  .txn-item:last-child { border-bottom: none; }
  .txn-item:hover { background: var(--surface-2); padding-left: 8px; padding-right: 8px; }
  .txn-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; background: var(--surface-3); }
  .txn-info { min-width: 0; }
  .txn-desc { font-size: 13px; font-weight: 600; letter-spacing: -0.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .txn-meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .txn-amount { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; text-align: right; }
  .txn-amount.neg { color: var(--coral); }
  .txn-amount.pos { color: var(--sage); }

<script>
/* ============================================================
   BACKEND INTEGRATION
   ============================================================ */
let currentUserId = localStorage.getItem('studentOS_userId') || null;
let liveEmails = null;
let liveEvents = null;
let syncStatus = 'idle';

function connectGoogle() { window.location.href = '/auth/login'; }

async function disconnectGoogle() {
  if (!currentUserId) return;
  try { await fetch('/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUserId }) }); } catch (e) {}
  currentUserId = null; liveEmails = null; liveEvents = null; syncStatus = 'idle';
  localStorage.removeItem('studentOS_userId');
  updateConnectUI(); updateSyncIndicator(); renderAll();
}

(async function handleAuthReturn() {
  const params = new URLSearchParams(window.location.search);
  const auth = params.get('auth'), userId = params.get('userId');
  if (auth === 'success' && userId) {
    currentUserId = userId;
    localStorage.setItem('studentOS_userId', userId);
    window.history.replaceState({}, '', window.location.pathname);
    await fetchLiveData();
  } else if (auth === 'error') {
    console.warn('Auth failed:', params.get('reason'));
    alert(`Google sign-in failed: ${params.get('reason')}`);
    window.history.replaceState({}, '', window.location.pathname);
  }
  updateConnectUI(); updateSyncIndicator();
})();

async function fetchLiveData() {
  if (!currentUserId) return;
  syncStatus = 'syncing'; updateSyncIndicator();
  try {
    const gmailRes = await fetch(`/api/gmail/messages?userId=${encodeURIComponent(currentUserId)}&maxResults=50`);
    if (gmailRes.status === 401) {
      currentUserId = null; localStorage.removeItem('studentOS_userId');
      liveEmails = null; liveEvents = null; syncStatus = 'idle';
      updateConnectUI(); updateSyncIndicator(); renderAll(); return;
    }
    if (gmailRes.ok) {
      const data = await gmailRes.json();
      liveEmails = (data.messages || []).map(m => ({
        id: m.id, from: m.from, subject: m.subject, preview: m.snippet,
        time: relativeTime(m.date), unread: m.unread, important: m.important
      }));
    }
    const calRes = await fetch(`/api/calendar/events?userId=${encodeURIComponent(currentUserId)}&days=14`);
    if (calRes.ok) { const data = await calRes.json(); liveEvents = data.events || []; }
    syncStatus = 'live';
  } catch (err) { console.warn('Live fetch failed:', err); syncStatus = 'error'; }
  updateSyncIndicator(); renderAll();
}

function relativeTime(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d ago`;
  return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function updateConnectUI() {
  const btn = document.getElementById('connect-btn');
  if (!btn) return;
  if (currentUserId) {
    btn.innerHTML = `✓ ${currentUserId.split('@')[0]}`;
    btn.classList.remove('amber'); btn.classList.add('sage');
    btn.onclick = () => { if (confirm('Disconnect Google account?')) disconnectGoogle(); };
  } else {
    btn.innerHTML = '🔗 Connect Google';
    btn.classList.add('amber'); btn.classList.remove('sage');
    btn.onclick = connectGoogle;
  }
}
function updateSyncIndicator() {
  const ind = document.getElementById('sync-indicator'), txt = document.getElementById('sync-text');
  if (!ind || !txt) return;
  if (!currentUserId) { ind.style.display = 'none'; return; }
  ind.style.display = 'inline-flex';
  ind.classList.remove('syncing', 'live');
  if (syncStatus === 'syncing') { ind.classList.add('syncing'); txt.textContent = 'Syncing...'; }
  else if (syncStatus === 'live') { ind.classList.add('live'); txt.textContent = 'Live'; }
  else if (syncStatus === 'error') { txt.textContent = 'Sync failed'; }
  else { txt.textContent = 'Not synced'; }
}
function getEmails() { return liveEmails || []; }
function getLiveEvents() { return liveEvents || []; }

/* ============================================================
   DATA
   ============================================================ */
let CLASSES = [];
const TRANSACTIONS = [];

function computeAllDates() {
  if (!CLASSES.length) {
    const today = new Date();
    const dow = today.getDay();
    const daysBack = dow === 0 ? 6 : dow - 1;
    const start = new Date(today);
    start.setDate(start.getDate() - daysBack);
    start.setHours(0, 0, 0, 0);
    const out = [];
    for (let i = 0; i < 28; i++) { const d = new Date(start); d.setDate(start.getDate() + i); out.push(isoFrom(d)); }
    return out;
  }
  const dates = [...new Set(CLASSES.map(c => c.date))].sort();
  const min = parseISO(dates[0]), max = parseISO(dates[dates.length - 1]);
  const start = new Date(min);
  const dow = start.getDay();
  start.setDate(start.getDate() - (dow === 0 ? 6 : dow - 1));
  const totalDays = Math.max(28, Math.ceil((max - start) / 86400000) + 8);
  const out = [];
  for (let i = 0; i < totalDays; i++) { const d = new Date(start); d.setDate(start.getDate() + i); out.push(isoFrom(d)); }
  return out;
}
let ALL_DATES = computeAllDates();

/* ============================================================
   HELPERS
   ============================================================ */
function isoFrom(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseISO(iso) { return new Date(iso + 'T00:00:00'); }
function fmtTime(h) { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); const period = hh >= 12 ? 'PM' : 'AM'; const d = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh; return mm ? `${d}:${String(mm).padStart(2,'0')} ${period}` : `${d} ${period}`; }
function fmtTimeShort(h) { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); const period = hh >= 12 ? 'pm' : 'am'; const d = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh; return mm ? `${d}:${String(mm).padStart(2,'0')}${period}` : `${d}${period}`; }
function fmtRange(a, b) { return `${fmtTime(a)} – ${fmtTime(b)}`; }
function fmtRangeShort(a, b) { return `${fmtTimeShort(a)}–${fmtTimeShort(b)}`; }
function fmtDate(iso) { return parseISO(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short' }); }
function fmtDateLong(iso) { return parseISO(iso).toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' }); }
function fmtDateFull(iso) { return parseISO(iso).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' }); }
function dowShort(iso) { return parseISO(iso).toLocaleDateString('en-GB', { weekday:'short' }); }
function dow(iso) { return parseISO(iso).toLocaleDateString('en-GB', { weekday:'long' }); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hFmt(n) { return Number.isInteger(n) ? n + 'h' : n.toFixed(1).replace(/\.0$/, '') + 'h'; }
function hNum(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function money(n) { return (n < 0 ? '-Rs. ' : 'Rs. ') + Math.abs(n).toLocaleString('en-IN'); }
function fmtCompact(n) {
  const abs = Math.abs(n);
  if (abs >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (abs >= 10000) return Math.round(n/1000) + 'k';
  if (abs >= 1000) return (n/1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return Math.round(n).toString();
}
function isWeekend(iso) { const d = parseISO(iso).getDay(); return d === 0 || d === 6; }
function daysAway(iso) { const today = new Date(); today.setHours(0,0,0,0); return Math.round((parseISO(iso) - today) / 86400000); }

/* ============================================================
   JOB HELPERS
   ============================================================ */
function getJobs() { return state.jobs || []; }
function isHoliday(iso) { return (state.holidays || []).includes(iso); }
function isWorkDay(iso) {
  if (isHoliday(iso)) return false;
  const dow = parseISO(iso).getDay();
  return getJobs().some(j => j.days && j.days.includes(dow));
}
function getJobsOnDay(iso) {
  if (isHoliday(iso)) return [];
  const dow = parseISO(iso).getDay();
  return getJobs().filter(j => j.days && j.days.includes(dow));
}
function jobHours(iso) { return getJobsOnDay(iso).reduce((s, j) => s + (j.end - j.start), 0); }
function totalWeeklyHours() { return getJobs().reduce((t, j) => t + (j.days.length * (j.end - j.start)), 0); }
function jobEarningsForDate(iso) { return getJobsOnDay(iso).reduce((s, j) => s + (j.end - j.start) * (j.rate || 0), 0); }
function totalEarningsInPeriod() { return ALL_DATES.reduce((s, d) => s + jobEarningsForDate(d), 0); }
function dayLetter(n) { return ['S','M','T','W','T','F','S'][n]; }
function dayName(n) { return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n]; }
function decToTimeStr(h) { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; }
function timeStrToDec(s) { if (!s) return 0; const [hh, mm] = s.split(':').map(Number); return hh + mm / 60; }

function getJobIncomes() {
  return getJobs()
    .filter(j => j.salary && j.salary > 0)
    .map(j => ({
      id: 'job-salary-' + j.id,
      name: j.name + ' (monthly)',
      amount: j.salary,
      color: j.color || '#e09a4e',
      fromJob: true
    }));
}
function getAllIncomes() { return [...state.incomes, ...getJobIncomes()]; }

function getAllExpenses() {
  const periodicColors = ['#d4745e', '#e09070', '#c9664f'];
  const periodicAsExpense = (state.periodic || []).map((p, i) => ({
    id: 'pe_' + p.id,
    name: p.name,
    amount: p.amount,
    color: periodicColors[i % periodicColors.length],
    icon: '🔄',
    isRecurring: true
  }));
  return [...state.expenses, ...periodicAsExpense];
}

/* ============================================================
   DECISION / CALC
   ============================================================ */
function decideClass(c) {
  const dayJobs = getJobsOnDay(c.date);
  const hasConflict = dayJobs.some(j => c.start < j.end && c.end > j.start);
  if (hasConflict) return { action: 'skip', reason: 'work' };
  return { action: 'attend', reason: 'attend' };
}
function attendedHours(iso) {
  return CLASSES.filter(c => c.date === iso && decideClass(c).action === 'attend').reduce((s, c) => s + (c.end - c.start), 0);
}
function sleepHours() { return 8; }
function freeHours(iso) { return 24 - sleepHours() - jobHours(iso) - attendedHours(iso); }
function freeSlotsOnDate(iso) {
  const busy = [];
  getJobsOnDay(iso).forEach(j => busy.push([j.start, j.end]));
  CLASSES.filter(c => c.date === iso && decideClass(c).action === 'attend').forEach(c => busy.push([c.start, c.end]));
  let slots = [[7, 23]];
  for (const b of busy) slots = slots.flatMap(s => subtractInterval(s, b));
  return slots.filter(([s, e]) => e - s >= 0.5);
}
function subtractInterval([s, e], [us, ue]) {
  if (ue <= s || us >= e) return [[s, e]];
  const out = [];
  if (s < us) out.push([s, us]);
  if (e > ue) out.push([ue, e]);
  return out;
}
function todoOccursOn(todo, iso) {
  if (!todo.startDate) return false;
  const start = parseISO(todo.startDate), d = parseISO(iso);
  if (d < start) return false;
  const diff = Math.round((d - start) / 86400000);
  switch (todo.recurrence) {
    case 'once': return diff === 0;
    case 'daily': return true;
    case 'every-2-days': return diff % 2 === 0;
    case 'weekly': return diff % 7 === 0;
    case 'monthly': return d.getDate() === start.getDate();
    default: return false;
  }
}
function recurrenceLabel(r) { return { once:'Once', daily:'Daily', 'every-2-days':'Every 2 days', weekly:'Weekly', monthly:'Monthly' }[r] || 'Once'; }

/* ============================================================
   STATE
   ============================================================ */
function seedState() {
  const today = new Date();
  return {
    mode: 'normal',
    classes: [],
    catchupStatus: {},
    todos: [],
    incomes: [],
    expenses: [],
    periodic: [],
    goals: [],
    jobs: [],
    holidays: [],
    startingBalance: 0,
    lastMonthBalance: 0,
    calendarMonth: { year: today.getFullYear(), month: today.getMonth() },
    selectedDay: isoFrom(today),
    emailFilter: 'all',
    expandedEmail: null
  };
}
let state = loadState() || seedState();
if (state.classes && state.classes.length) CLASSES = state.classes;
if (!state.jobs) state.jobs = [];
if (!state.holidays) state.holidays = [];
ALL_DATES = computeAllDates();

function saveState() { state.classes = CLASSES; try { localStorage.setItem('studentOS_v16', JSON.stringify(state)); } catch(e){} }
function loadState() { try { const r = localStorage.getItem('studentOS_v16'); return r ? JSON.parse(r) : null; } catch(e){ return null; } }

function resetAll() {
  if (!confirm('Reset everything? This clears your timetable, jobs, finances, todos, and disconnects Google.')) return;
  if (currentUserId) disconnectGoogle();
  localStorage.removeItem('studentOS_v16'); localStorage.removeItem('studentOS_userId');
  state = seedState(); CLASSES = []; ALL_DATES = computeAllDates();
  document.body.setAttribute('data-mode', 'normal');
  saveState(); renderAll();
}
function setMode(mode) {
  state.mode = mode;
  document.body.setAttribute('data-mode', mode);
  document.querySelectorAll('.mode-switch button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  saveState();
}

/* ============================================================
   PDF UPLOAD
   ============================================================ */
let parsedPreview = null;
let importMode = 'replace';

function openUploadModal() { parsedPreview = null; importMode = 'replace'; document.getElementById('upload-modal').classList.add('open'); renderUploadBody(); renderUploadFooter(); }
function closeUploadModal() { document.getElementById('upload-modal').classList.remove('open'); }

function renderUploadBody() {
  const body = document.getElementById('upload-body');
  if (parsedPreview === null) {
    body.innerHTML = `
      <label class="drop-zone" id="drop-zone" for="pdf-input">
        <div class="icon">📄</div>
        <div class="title">Drop your timetable PDF here</div>
        <div class="hint">or click to browse · PDF format</div>
        <input type="file" id="pdf-input" accept=".pdf,application/pdf" onchange="handlePdfFile(event)" />
      </label>
      <div class="or-divider">or paste text</div>
      <textarea class="input paste-area" id="paste-text" placeholder="Paste the timetable text here..."></textarea>
      <div style="margin-top: 10px;"><button class="btn ghost small" onclick="parsePastedText()">Parse pasted text</button></div>
    `;
    const dz = document.getElementById('drop-zone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); const f = e.dataTransfer.files[0]; if (f) handlePdfFile({ target: { files: [f] } }); });
    return;
  }
  if (parsedPreview.error) {
    body.innerHTML = `<div class="error-box"><strong>Could not parse this file.</strong><br>${esc(parsedPreview.error)}</div><div style="margin-top: 16px;"><button class="btn ghost small" onclick="resetUpload()">Try again</button></div>`;
    return;
  }
  if (parsedPreview.classes.length === 0) {
    body.innerHTML = `<div class="error-box"><strong>No classes detected.</strong></div><div style="margin-top: 16px;"><button class="btn ghost small" onclick="resetUpload()">Try again</button></div>`;
    return;
  }
  const rows = parsedPreview.classes.map((c, i) => `
    <label class="preview-item">
      <input type="checkbox" checked data-idx="${i}" onchange="togglePreviewItem(${i}, this.checked)" />
      <div class="preview-info">
        <div class="preview-name">${esc(c.name)}</div>

function togglePreviewItem(idx, checked) { if (parsedPreview && parsedPreview.classes[idx]) parsedPreview.classes[idx]._enabled = checked; }

async function handlePdfFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const body = document.getElementById('upload-body');
  body.innerHTML = `<div class="processing"><div class="spinner"></div><div style="font-weight: 600;">Reading PDF...</div></div>`;
  try {
    const formData = new FormData(); formData.append('pdf', file);
    const res = await fetch('/api/pdf/parse', { method: 'POST', body: formData });
    if (!res.ok) {
      const text = await extractPdfTextLocal(file);
      const classes = parseTimetableTextLocal(text);
      if (classes.length === 0) parsedPreview = { error: 'No class entries matched.', raw: text };
      else parsedPreview = { classes: classes.map(c => ({ ...c, _enabled: true })), raw: text };
    } else {
      const data = await res.json();
      if (!data.classes || data.classes.length === 0) parsedPreview = { error: 'No class entries matched.' };
      else parsedPreview = { classes: data.classes.map(c => ({ ...c, _enabled: true })) };
    }
  } catch (err) { parsedPreview = { error: err.message || String(err) }; }
  renderUploadBody(); renderUploadFooter();
}

async function extractPdfTextLocal(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF library not loaded.');
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const strings = content.items.map(item => item.str).filter(s => s && s.trim());
    fullText += strings.join(' ') + ' \n';
  }
  return fullText;
}
function parseTimetableTextLocal(rawText) {
  let text = rawText.replace(/\s+/g, ' ').trim();
  text = text
    .replace(/(\d{2}-[A-Za-z]{3}-\d{2,4})(?=[A-Z])/g, '$1 ')
    .replace(/(\d{1,2}:\d{2}\s*[AP]M)\s*[–-]\s*(\d{1,2}:\d{2}\s*[AP]M)/g, '$1 – $2 ')
    .replace(/(\d{1,2}:\d{2}\s*[AP]M)(?=[A-Z])/g, '$1 ')
    .replace(/(CS\d+(?:\+CS\d+)*)/g, ' $1 ')
    .replace(/(\d+(?:st|nd|rd|th)\s+Floor)/gi, ' $1 ')
    .replace(/\s+/g, ' ');
  const dateRe = /(\d{1,2})-([A-Za-z]{3})-(\d{2,4})/g;
  const matches = [...text.matchAll(dateRe)];
  const entries = [];
  for (let i = 0; i < matches.length; i++) {
    const start = matches[i].index;
    const end = i + 1 < matches.length ? matches[i + 1].index : text.length;
    const parsed = parseChunkLocal(text.slice(start, end).trim());
    if (parsed) entries.push(parsed);
  }
  return entries;
}
function parseChunkLocal(chunk) {
  const dateMatch = chunk.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})/);
  if (!dateMatch) return null;
  const monthMap = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
  const monthKey = dateMatch[2].charAt(0).toUpperCase() + dateMatch[2].slice(1).toLowerCase();
  const month = monthMap[monthKey]; if (month === undefined) return null;
  const day = parseInt(dateMatch[1]);
  const yearShort = parseInt(dateMatch[3]);
  const year = yearShort < 100 ? 2000 + yearShort : yearShort;
  const date = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const timeMatch = chunk.match(/(\d{1,2}):(\d{2})\s*([AP]M)\s*[–-]\s*(\d{1,2}):(\d{2})\s*([AP]M)/i);
  if (!timeMatch) return null;
  const toDec = (h, m, ap) => { let hh = parseInt(h); if (ap.toUpperCase() === 'PM' && hh !== 12) hh += 12; if (ap.toUpperCase() === 'AM' && hh === 12) hh = 0; return hh + parseInt(m)/60; };
  const startTime = toDec(timeMatch[1], timeMatch[2], timeMatch[3]);
  const endTime = toDec(timeMatch[4], timeMatch[5], timeMatch[6]);
  const afterTime = chunk.slice(chunk.indexOf(timeMatch[0]) + timeMatch[0].length).trim();
  const typePattern = /^(Departmental Briefing|Course Briefing|Module Briefings?|Guest sessions?|Lecture|Seminar|Lab|Workshop|Tutorial)/i;
  const typeMatch = afterTime.match(typePattern);
  let type = 'Class', rest = afterTime;
  if (typeMatch) { type = typeMatch[1].replace(/s$/, '').trim(); rest = afterTime.slice(typeMatch[0].length).trim(); }
  const groupMatch = rest.match(/(CS\d+(?:\+CS\d+)*)/);
  let titlePart = rest;
  if (groupMatch) { titlePart = rest.slice(0, groupMatch.index).trim(); rest = rest.slice(groupMatch.index + groupMatch[0].length).trim(); }
  const floorMatch = rest.match(/^(\d+(?:st|nd|rd|th)\s+Floor|Ground Floor|Lower Ground|Basement)/i);
  let floor = '';
  if (floorMatch) { floor = floorMatch[1]; rest = rest.slice(floorMatch[0].length).trim(); }
  const room = rest.replace(/^[-\s]+/, '').trim();
  let name = titlePart.trim() || type;
  return { id: 'c_' + date + '_' + Math.round(startTime * 100), date, name, topic: type, start: startTime, end: endTime, floor, room, type };
}
function parsePastedText() {
  const text = document.getElementById('paste-text')?.value || '';
  if (!text.trim()) return;
  const classes = parseTimetableTextLocal(text);
  if (classes.length === 0) parsedPreview = { error: 'No class entries matched.' };
  else parsedPreview = { classes: classes.map(c => ({ ...c, _enabled: true })) };
  renderUploadBody(); renderUploadFooter();
}
function confirmImport() {
  if (!parsedPreview || !parsedPreview.classes) return;
  const toAdd = parsedPreview.classes.filter(c => c._enabled !== false).map(c => { const clean = { ...c }; delete clean._enabled; return clean; });
  if (toAdd.length === 0) { closeUploadModal(); return; }
  if (importMode === 'replace') { CLASSES.length = 0; CLASSES.push(...toAdd); }
  else {
    const existing = new Set(CLASSES.map(c => `${c.date}|${c.start}|${c.name}`));
    toAdd.forEach(c => { const key = `${c.date}|${c.start}|${c.name}`; if (!existing.has(key)) { CLASSES.push(c); existing.add(key); } });
  }
  ALL_DATES = computeAllDates();
  if (CLASSES.length) {
    const first = CLASSES.map(c => c.date).sort()[0];
    const d = parseISO(first);
    state.calendarMonth = { year: d.getFullYear(), month: d.getMonth() };
    state.selectedDay = first;
  }
  saveState(); renderAll(); closeUploadModal();
}

function addEditItem() {
  const name = (document.getElementById('edit-name')?.value || '').trim();
  const amount = parseFloat(document.getElementById('edit-amount')?.value);
  const extra = document.getElementById('edit-extra')?.value || '';
  if (!name || !amount || amount <= 0) return;

  if (editType === 'incomes') state.incomes.push({ id: 'i' + Date.now(), name, amount, color: FIN_COLORS[state.incomes.length % FIN_COLORS.length] });
  else if (editType === 'expenses') state.expenses.push({ id: 'x' + Date.now(), name, amount, icon: extra || '💸', color: FIN_COLORS[state.expenses.length % FIN_COLORS.length] });
  else if (editType === 'periodic') {
    const goalId = document.getElementById('edit-goal')?.value || null;
    const goalAmount = parseFloat(document.getElementById('edit-goal-amount')?.value) || 0;
    const p = { id: 'p' + Date.now(), name, cat: 'Other', amount, day: Math.min(Math.max(parseInt(extra) || 1, 1), 28), frequency: 'Monthly' };
    if (goalId && goalAmount > 0) { p.goalId = goalId; p.goalAmount = goalAmount; }
    state.periodic.push(p);
    if (goalId && goalAmount > 0) {
      const goal = state.goals.find(g => g.id === goalId);
      if (goal) goal.saved += goalAmount;

/* ============================================================
   SANKEY — money flow diagram
   ============================================================ */
function truncateLabel(s, n = 22) {
  s = String(s);
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

function capSankeyNodes(nodes, max = 7) {
  const clean = nodes.filter(n => n.amount > 0).map(n => ({ ...n }));
  if (clean.length <= max) return clean;
  const sorted = [...clean].sort((a, b) => b.amount - a.amount);
  const keep = sorted.slice(0, max - 1);
  const restTotal = sorted.slice(max - 1).reduce((s, n) => s + n.amount, 0);
  return [...keep, { name: 'Other', amount: restTotal, color: '#7a7060' }];
}

function buildSankeyData() {
  const incomes  = getAllIncomes();
  const expenses = getAllExpenses();
  const totalIncome  = incomes.reduce((s, x) => s + x.amount, 0);
  const totalExpense = expenses.reduce((s, x) => s + x.amount, 0);
  const net = totalIncome - totalExpense;

  const sources = incomes.map(i => ({ name: i.name, amount: i.amount, color: i.color }));
  const targets = expenses.map(e => ({ name: e.name, amount: e.amount, color: e.color }));

  if (net > 0.5)       targets.push({ name: 'Savings', amount: net, color: '#86ab7a' });
  else if (net < -0.5) sources.push({ name: 'Deficit', amount: -net, color: '#d4745e' });

  return {
    sources: capSankeyNodes(sources, 6),
    targets: capSankeyNodes(targets, 7),
    totalIncome,
    totalExpense,
    net
  };
}

function sankeyChart(sources, targets, opts = {}) {
  const W = opts.width  || 880;
  const H = opts.height || 380;
  const nodeW = 12;
  const padX  = 168;
  const padY  = 14;

  const src = [...sources].filter(n => n.amount > 0).sort((a, b) => b.amount - a.amount);
  const tgt = [...targets].filter(n => n.amount > 0).sort((a, b) => b.amount - a.amount);

  const totalL = src.reduce((s, n) => s + n.amount, 0);
  const totalR = tgt.reduce((s, n) => s + n.amount, 0);

  if (totalL <= 0 && totalR <= 0) {
    return '<div class="empty">Add income sources and expenses to see your money flow.</div>';
  }

  // Keep the diagram honest if the two sides don't add up
  const total = Math.max(totalL, totalR);
  if (totalL < totalR - 0.5) src.push({ name: 'Deficit', amount: totalR - totalL, color: '#d4745e' });
  else if (totalR < totalL - 0.5) tgt.push({ name: 'Unallocated', amount: totalL - totalR, color: '#7a7060' });

  function layout(nodes) {
    const n = nodes.length;
    const gap = n <= 1 ? 0 : Math.min(18, (H - padY * 2) / (n * 3.2));
    const usable = H - padY * 2 - gap * (n - 1);
    const scale = usable / total;
    let y = padY;
    const items = nodes.map(node => {
      const h = node.amount * scale;
      const item = { ...node, y, h };
      y += h + gap;
      return item;
    });
    return { items, usable, gap };
  }

  const L = layout(src);
  const R = layout(tgt);
  const scaleL = L.usable / total;
  const scaleR = R.usable / total;

  const xL = padX;
  const xR = W - padX;
  const x0 = xL + nodeW;
  const x1 = xR - nodeW;
  const mx = (x0 + x1) / 2;

  const lOff = L.items.map(n => n.y);
  const rOff = R.items.map(n => n.y);

  // ---- ribbons ----
  let links = '';
  L.items.forEach((sn, i) => {
    R.items.forEach((tn, j) => {
      const v = (sn.amount * tn.amount) / total;
      if (v <= 0) return;
      const hL = v * scaleL;
      const hR = v * scaleR;
      const y0 = lOff[i];
      const y1 = rOff[j];
      lOff[i] += hL;
      rOff[j] += hR;
      const d = `M ${x0} ${y0.toFixed(2)} `
              + `C ${mx} ${y0.toFixed(2)}, ${mx} ${y1.toFixed(2)}, ${x1} ${y1.toFixed(2)} `
              + `L ${x1} ${(y1 + hR).toFixed(2)} `
              + `C ${mx} ${(y1 + hR).toFixed(2)}, ${mx} ${(y0 + hL).toFixed(2)}, ${x0} ${(y0 + hL).toFixed(2)} Z`;
      links += `<path class="sankey-link" d="${d}" fill="${sn.color}" stroke="none">`
             + `<title>${esc(sn.name)} → ${esc(tn.name)}: ${money(v)}</title></path>`;
    });
  });

  // ---- nodes ----
  const nodeRect = (n, x) =>
    `<g class="sankey-node">`
    + `<rect x="${x}" y="${n.y.toFixed(2)}" width="${nodeW}" height="${Math.max(n.h, 1).toFixed(2)}" rx="3" fill="${n.color}"/>`
    + `<title>${esc(n.name)}: ${money(n.amount)}</title></g>`;

  // ---- labels ----
  const labelLeft = (n) =>
    `<text x="${xL - 12}" y="${(n.y + n.h / 2 + 4).toFixed(2)}" text-anchor="end">`
    + `<tspan class="sankey-label">${esc(truncateLabel(n.name))}</tspan>`
    + `<tspan class="sankey-value" dx="8">${money(n.amount)}</tspan></text>`;

  const labelRight = (n) =>
    `<text x="${xR + 12}" y="${(n.y + n.h / 2 + 4).toFixed(2)}" text-anchor="start">`
    + `<tspan class="sankey-label">${esc(truncateLabel(n.name))}</tspan>`
    + `<tspan class="sankey-value" dx="8">${money(n.amount)}</tspan></text>`;

  return `
    <svg class="sankey" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Money flow diagram">
      <g class="sankey-links">${links}</g>
      <g class="sankey-nodes">
        ${L.items.map(n => nodeRect(n, xL)).join('')}
        ${R.items.map(n => nodeRect(n, xR - nodeW)).join('')}
      </g>
      <g class="sankey-labels">
        ${L.items.map(labelLeft).join('')}
        ${R.items.map(labelRight).join('')}
      </g>
    </svg>
  `;
}

/* ============================================================
   CHART HELPERS
   ============================================================ */
function donutChart(data, size, options = {}) {
  const { centerText = '', subText = '', thickness = 6 } = options;
  const r = 15.915;
  const total = data.reduce((s, d) => s + Math.abs(d.amount), 0) || 1;
  let offset = 0;
  const circles = data.map(d => {
    const pct = (Math.abs(d.amount) / total) * 100;
    const circle = `<circle class="donut-circle" cx="21" cy="21" r="${r}" fill="none" stroke="${d.color}" stroke-width="${thickness}" stroke-dasharray="${pct} 100" stroke-dashoffset="-${offset}" transform="rotate(-90 21 21)"/>`;
    offset += pct;
    return circle;
  }).join('');
  const sizeClass = { lg:'donut-lg', md:'donut-md', sm:'donut-sm', xs:'donut-xs' }[size] || 'donut-xs';
  const fontMap = { lg: { center: 5.8, sub: 2.2, centerY: 19.8, subY: 25.0 }, md: { center: 5.0, sub: 1.9, centerY: 20.2, subY: 24.6 }, sm: { center: 4.2, sub: 0, centerY: 21, subY: 0 }, xs: { center: 3.6, sub: 0, centerY: 21, subY: 0 } };
  const f = fontMap[size] || fontMap.xs;
  const hasSub = subText && f.sub > 0;
  const cy = hasSub ? f.centerY : 21;
  return `
    <svg class="donut ${sizeClass}" viewBox="0 0 42 42">
      <circle cx="21" cy="21" r="${r}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="${thickness}"/>
      ${circles}
      ${centerText ? `<text x="21" y="${cy}" text-anchor="middle" dominant-baseline="middle" class="donut-center" style="font-size: ${f.center}px;">${centerText}</text>` : ''}
      ${hasSub ? `<text x="21" y="${f.subY}" text-anchor="middle" dominant-baseline="middle" class="donut-sub" style="font-size: ${f.sub}px;">${subText}</text>` : ''}
    </svg>
  `;
}
function progressRing(pct, color, size = 'md', centerText = '') {
  const r = 15.915;
  const dashArray = `${Math.min(Math.max(pct, 0), 100)} 100`;
  const sizeClass = { lg:'donut-lg', md:'donut-md', sm:'donut-sm', xs:'donut-xs' }[size] || 'donut-xs';
  const fontSizes = { lg: 5.8, md: 5.2, sm: 4.4, xs: 3.8 };
  const fs = fontSizes[size] || 4;
  return `
    <svg class="donut ${sizeClass}" viewBox="0 0 42 42">
      <circle cx="21" cy="21" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="5"/>
      <circle class="donut-circle" cx="21" cy="21" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-dasharray="${dashArray}" stroke-dashoffset="0" transform="rotate(-90 21 21)" stroke-linecap="round"/>
      <text x="21" y="21" text-anchor="middle" dominant-baseline="middle" class="donut-center" style="font-size: ${fs}px;">${centerText || Math.round(pct) + '%'}</text>
    </svg>
  `;
}

/* ============================================================
   SCHEDULE BUILD
   ============================================================ */
function buildSchedule() {
  const rows = [], skipped = [], attended = [];
  CLASSES.forEach(c => {
    const decision = decideClass(c);
    if (decision.action === 'skip') {
      const skipId = 'skip_' + c.id;
      skipped.push({
        id: skipId, classId: c.id, className: c.name, topic: c.topic || '', type: c.type || '',
        date: c.date, start: c.start, end: c.end, hoursMissed: c.end - c.start,
        floor: c.floor, room: c.room, status: state.catchupStatus[skipId] || 'pending'
      });
      rows.push({ ...c, skipped: true, skipId, decision });
    } else {
      attended.push({ ...c, decision });
      rows.push({ ...c, skipped: false, decision });
    }
  });
  return { rows, skipped, attended };
}
let schedule = null;
let todoInstances = [];

function placeTodos() {
  const instances = [];
  const usage = {};
  ALL_DATES.forEach(d => usage[d] = []);
  const sorted = [...state.todos].sort((a, b) => {
    const order = { high: 0, med: 1, low: 2 };
    return order[a.priority] - order[b.priority];
  });
  for (const todo of sorted) {
    if (todo.recurrence === 'once' && todo.completed) continue;
    if (todo.scheduledOnCalendar === false) continue;
    let dates;
    if (todo.recurrence === 'once') dates = [todo.startDate];
    else dates = ALL_DATES.filter(d => todoOccursOn(todo, d) && !todo.completedDates.includes(d));
    for (const date of dates) {
      if (!date) continue;
      const slots = freeSlotsOnDate(date);
      let available = slots.map(s => [...s]);
      for (const u of usage[date]) available = available.flatMap(a => subtractInterval(a, u));
      for (const [s, e] of available) {
        if (e - s >= todo.hours) {
          instances.push({ todoId: todo.id, date, start: s, end: s + todo.hours });
          usage[date].push([s, s + todo.hours]);
          break;
        }
      }
    }
  }
  return instances;
}

function animateCountUp() {
  document.querySelectorAll('[data-countup]').forEach(el => {
    const target = parseFloat(el.getAttribute('data-countup'));
    if (isNaN(target)) return;
    const isMoney = el.getAttribute('data-money') === 'true';
    const isDecimal = target % 1 !== 0;
    const isPercent = el.getAttribute('data-percent') === 'true';
    const dur = 900, start = performance.now();
    function tick(now) {
      const p = Math.min((now - start) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = target * eased;
      if (isMoney) el.textContent = (val < 0 ? '-Rs. ' : 'Rs. ') + Math.abs(Math.round(val)).toLocaleString('en-IN');
      else if (isPercent) el.textContent = (val >= 0 ? '+' : '') + val.toFixed(1) + '%';
      else if (isDecimal) el.textContent = val.toFixed(1) + 'h';
      else el.textContent = Math.round(val);
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function renderAll() {
  schedule = buildSchedule();
  todoInstances = placeTodos();
  renderOverview();
  renderUni();
  renderJob();
  renderFinance();
  saveState();
  setTimeout(animateCountUp, 50);
}

/* ============================================================
   CALENDAR
   ============================================================ */
function getMonthGrid(year, month) {
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const startDow = first.getDay();
  const daysInMonth = last.getDate();
  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) { const d = new Date(year, month, -i); cells.push({ iso: isoFrom(d), other: true }); }
  for (let i = 1; i <= daysInMonth; i++) cells.push({ iso: isoFrom(new Date(year, month, i)), other: false });
  while (cells.length % 7 !== 0) {
    const lastCell = cells[cells.length - 1].iso;
    const next = parseISO(lastCell); next.setDate(next.getDate() + 1);
    cells.push({ iso: isoFrom(next), other: true });
  }
  return cells;
}
function getDayEvents(iso, filter) {
  const events = [];
  if (filter === 'uni' || filter === 'all') {
    CLASSES.filter(c => c.date === iso && decideClass(c).action === 'attend').forEach(c => events.push({ type:'attend', label: c.name, time: fmtRangeShort(c.start, c.end) }));
    CLASSES.filter(c => c.date === iso && decideClass(c).action === 'skip').forEach(c => events.push({ type:'skip', label: c.name, time: fmtRangeShort(c.start, c.end) }));
  }
  if (filter === 'all') {
    if (isHoliday(iso)) { events.push({ type:'holiday', label:'Holiday — day off', time:'All day' }); }
    else { getJobsOnDay(iso).forEach(j => events.push({ type:'job', label: j.name, time: fmtRangeShort(j.start, j.end) })); }
    todoInstances.filter(i => i.date === iso).forEach(i => {
      const t = state.todos.find(x => x.id === i.todoId);
      if (t) events.push({ type:'todo', label: t.title, time: fmtRangeShort(i.start, i.end) });
    });
    const liveToday = getLiveEvents().filter(e => e.start && e.start.slice(0,10) === iso);
    liveToday.forEach(e => {
      const timeStr = e.allDay ? 'All day' : new Date(e.start).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
      events.push({ type:'email', label: e.summary, time: timeStr });
    });
  }
  return events;
}
function calStatRow(hours, cls) {
  const dim = hours <= 0 ? ' dim' : '';
  return `<div class="cal-stat ${cls}${dim}"><span class="stat-dot"></span><span class="stat-val">${hNum(hours)}h</span></div>`;

      }).join('')
    : '<div class="detail-empty">Nothing scheduled this day.</div>';
  const legendHtml = filter === 'uni'

          <div class="day-detail-sub">${hFmt(freeHours(state.selectedDay))} free · ${selEvents.length} event${selEvents.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="detail-list">${detailHtml}</div>
      </div>
    </div>
  `;
}
function changeMonth(delta) {
  let { year, month } = state.calendarMonth;
  month += delta;
  if (month < 0) { month = 11; year--; }
  if (month > 11) { month = 0; year++; }
  state.calendarMonth = { year, month };
  renderAll();
}

/* ============================================================
   INSIGHTS
   ============================================================ */
function hasAnyData() {
  return CLASSES.length > 0 || state.todos.length > 0 || state.incomes.length > 0 || state.expenses.length > 0 || state.goals.length > 0 || state.periodic.length > 0 || state.jobs.length > 0 || (liveEmails && liveEmails.length > 0) || currentUserId;
}
function buildInsights() {
  const out = [];
  const totalFree = ALL_DATES.reduce((s, d) => s + freeHours(d), 0);
  const avgFree = totalFree / ALL_DATES.length;
  const skipped = schedule.skipped.length;
  const pendingTodos = state.todos.filter(t => !isTodoFullyDone(t)).length;
  const pendingSkips = schedule.skipped.filter(s => s.status === 'pending').length;

  if (!hasAnyData()) {
    out.push({ pri: 0, importance:'info', type:'good', icon:'👋', html:`<strong>Welcome.</strong> Start by uploading your timetable or connecting Google.` });
    return out;
  }
  if (pendingSkips >= 3) out.push({ pri: 0, importance:'critical', type:'bad', icon:'⚠️', html:`<strong>${pendingSkips} skipped sessions</strong> still need catch-up.` });
  if (pendingTodos >= 3) out.push({ pri: 0, importance:'critical', type:'bad', icon:'⏳', html:`<strong>${pendingTodos} tasks pending.</strong>` });
  if (skipped > 0 && pendingSkips < 3) out.push({ pri: 1, importance:'important', type:'warn', icon:'📘', html:`<strong>${skipped} session${skipped !== 1 ? 's' : ''} skipped</strong> due to work conflicts.` });
  if (pendingTodos > 0 && pendingTodos < 3) out.push({ pri: 1, importance:'important', type:'warn', icon:'📌', html:`<strong>${pendingTodos} task${pendingTodos !== 1 ? 's' : ''}</strong> in progress.` });
  if (CLASSES.length || state.todos.length) out.push({ pri: 2, importance:'normal', type:'good', icon:'☀️', html:`<strong>Plan your week.</strong> Check your calendar for free slots.` });
  if (pendingTodos === 0 && pendingSkips === 0 && hasAnyData()) out.push({ pri: 2, importance:'normal', type:'good', icon:'✅', html:`You're all caught up.` });
  if (CLASSES.length) out.push({ pri: 3, importance:'info', type:'good', icon:'⏱️', html:`<strong>${hFmt(totalFree)}</strong> of free time — <strong>${hFmt(avgFree)}/day</strong>.` });
  out.sort((a, b) => a.pri - b.pri);
  return out;
}

/* ---------- EMAIL READER ---------- */
async function openEmail(id) {
  const item = (liveEmails || []).find(e => e.id === id);
  const overlay = document.getElementById('email-modal');
  const subjEl = document.getElementById('email-modal-subject');
  const metaEl = document.getElementById('email-modal-meta');
  const bodyEl = document.getElementById('email-modal-body');
  const linkEl = document.getElementById('email-modal-link');

  if (item) item.unread = false;

  subjEl.textContent = item ? item.subject : 'Email';
  metaEl.textContent = item ? item.from : '';
  linkEl.href = `https://mail.google.com/mail/u/0/#inbox/${encodeURIComponent(id)}`;
  bodyEl.innerHTML = '<div class="processing"><div class="spinner"></div><div style="font-weight:600;">Opening email…</div></div>';
  overlay.classList.add('open');

  // Refresh the list so the unread dot disappears immediately
  renderAll();

  if (!currentUserId) {
    bodyEl.innerHTML = '<div class="error-box"><strong>Not connected.</strong><br>Reconnect Google to read this email.</div>';
    return;
  }

  try {
    const res = await fetch(`/api/gmail/messages/${encodeURIComponent(id)}?userId=${encodeURIComponent(currentUserId)}`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Request failed');
    }
    const data = await res.json();
    linkEl.href = `https://mail.google.com/mail/u/0/#inbox/${encodeURIComponent(data.threadId || data.id)}`;
    renderEmailModal(data);
  } catch (err) {
    bodyEl.innerHTML = `<div class="error-box"><strong>Couldn't open this email.</strong><br>${esc(err.message)}</div>`;
  }
}

function renderEmailModal(data) {
  document.getElementById('email-modal-subject').textContent = data.subject || '(no subject)';

  const when = data.date
    ? new Date(data.date).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })
    : '';
  document.getElementById('email-modal-meta').textContent = [data.from, when].filter(Boolean).join('   ·   ');

  const bodyEl = document.getElementById('email-modal-body');
  const attachments = (data.attachments || []).filter(a => a.filename);
  const attachHtml = attachments.length
    ? `<div class="email-attachments">${attachments.map(a => `<span class="pill low">📎 ${esc(a.filename)}</span>`).join('')}</div>`
    : '';

  if (data.html) {
    bodyEl.innerHTML = `${attachHtml}<iframe class="email-frame" id="email-frame" sandbox referrerpolicy="no-referrer"></iframe>`;
    const frame = document.getElementById('email-frame');
    if (frame) frame.srcdoc = wrapEmailHtml(data.html);
  } else if (data.text) {
    bodyEl.innerHTML = `${attachHtml}<pre class="email-text">${esc(data.text)}</pre>`;
  } else {
    bodyEl.innerHTML = `${attachHtml}<div class="empty">This email has no readable content.</div>`;
  }
}

function wrapEmailHtml(html) {
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
    html, body { margin: 0; }
    body {
      padding: 18px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.6; color: #1a1a1a; background: #ffffff;
      word-break: break-word; overflow-wrap: anywhere;
    }
    img { max-width: 100%; height: auto; }
    table { max-width: 100%; border-collapse: collapse; }
    a { color: #1a73e8; }
    blockquote { border-left: 2px solid #ddd; margin-left: 0; padding-left: 12px; color: #666; }
    pre { white-space: pre-wrap; }
  </style></head><body>${html}</body></html>`;
}

function closeEmailModal() {
  document.getElementById('email-modal').classList.remove('open');
  const frame = document.getElementById('email-frame');
  if (frame) frame.srcdoc = '';

function renderQuickAdd() {

      <button class="btn amber" onclick="quickAdd()">Add</button>
    </div>
  `;
}
function quickAdd() {
  const title = document.getElementById('qa-title').value.trim();
  const hours = parseFloat(document.getElementById('qa-hours').value) || 1;
  const priority = document.getElementById('qa-priority').value;
  const recurrence = document.getElementById('qa-recurrence').value;
  if (!title) return;
  state.todos.push({ id: 'td' + Date.now(), title, hours, priority, recurrence, startDate: ALL_DATES[0], completed: false, completedDates: [], scheduledOnCalendar: true });
  renderAll();
}
function renderTodos() {
  if (!state.todos.length) return '<div class="empty">No tasks yet. Add one above to get started.</div>';
  const sorted = [...state.todos].sort((a, b) => {
    const aDone = isTodoFullyDone(a), bDone = isTodoFullyDone(b);
    if (aDone !== bDone) return aDone ? 1 : -1;
    const order = { high: 0, med: 1, low: 2 };
    return order[a.priority] - order[b.priority];
  });
  return sorted.map(t => renderTodoItem(t)).join('');
}
function isTodoFullyDone(todo) {
  if (todo.recurrence === 'once') return todo.completed;
  const total = ALL_DATES.filter(d => todoOccursOn(todo, d)).length;
  return total > 0 && todo.completedDates.length >= total;
}
function renderTodoItem(todo) {
  const isRecur = todo.recurrence !== 'once';
  const nextPending = isRecur ? getNextPendingDate(todo) : null;
  const nextInstance = nextPending ? todoInstances.find(i => i.todoId === todo.id && i.date === nextPending) : todoInstances.find(i => i.todoId === todo.id);
  const fullyDone = isTodoFullyDone(todo);
  const scheduled = todo.scheduledOnCalendar !== false;

  let sugHtml = '';
  if (fullyDone) sugHtml = '';
  else if (nextInstance) {
    sugHtml = `
      <div class="todo-suggestion">
        <label>
          <input type="checkbox" ${scheduled ? 'checked' : ''} onchange="toggleTodoSchedule('${todo.id}', this.checked)" />
          <span>${scheduled ? 'Scheduled' : 'Not scheduled'} · ${dowShort(nextInstance.date)} ${fmtDate(nextInstance.date)}, ${fmtRange(nextInstance.start, nextInstance.end)}</span>
        </label>
      </div>`;
  }
  else if (!isRecur && todo.completed) sugHtml = '';
  else sugHtml = `<div class="todo-suggestion no-slot">No free slot found</div>`;

  let progressHtml = '';
  if (isRecur) {
    const total = ALL_DATES.filter(d => todoOccursOn(todo, d)).length;
    const done = todo.completedDates.length;
    progressHtml = `<span style="font-weight:600">${done}/${total} done</span>`;
  }
  const recurChip = isRecur ? `<span class="pill ${todo.priority}">${recurrenceLabel(todo.recurrence)}</span>` : '';
  return `
    <div class="todo-item ${fullyDone ? 'done' : ''}">
      <button class="todo-check ${fullyDone ? 'checked' : ''}" onclick="toggleTodo('${todo.id}')">✓</button>
      <div class="todo-body">
        <div class="todo-title">${esc(todo.title)}</div>
        <div class="todo-meta"><span>${hFmt(todo.hours)}</span>${recurChip}${progressHtml}</div>
        ${sugHtml}
      </div>
      <button class="todo-delete" onclick="deleteTodo('${todo.id}')">✕</button>
    </div>
  `;
}
function getNextPendingDate(todo) {
  for (const date of ALL_DATES) {
    if (!todoOccursOn(todo, date)) continue;
    if (todo.completedDates.includes(date)) continue;
    return date;
  }
  return null;
}
function toggleTodo(id) {
  const todo = state.todos.find(t => t.id === id);
  if (!todo) return;
  if (todo.recurrence === 'once') todo.completed = !todo.completed;
  else {
    const next = getNextPendingDate(todo);
    if (next) todo.completedDates.push(next);
    else todo.completedDates = [];
  }
  renderAll();
}
function toggleTodoSchedule(id, checked) {
  const todo = state.todos.find(t => t.id === id);
  if (!todo) return;
  todo.scheduledOnCalendar = checked;
  renderAll();
}
function deleteTodo(id) { state.todos = state.todos.filter(t => t.id !== id); renderAll(); }

function renderUni() {
  const totalAttend = schedule.attended.length;
  const totalSkip = schedule.skipped.length;
  const hoursAttended = schedule.attended.reduce((s, r) => s + (r.end - r.start), 0);
  const hoursMissed = schedule.skipped.reduce((s, r) => s + r.hoursMissed, 0);
  const pending = schedule.skipped.filter(s => s.status === 'pending').length;
  const resolved = totalSkip - pending;
  const pct = totalSkip ? Math.round(resolved / totalSkip * 100) : 0;

  if (!CLASSES.length) {
    document.getElementById('view-uni').innerHTML = `
      <div class="card" style="text-align: center; padding: 60px 24px;">
        <div style="font-size: 40px; opacity: 0.5; margin-bottom: 16px;">🎓</div>

      </div>`;
    return;
  }

  const perType = {};
  schedule.rows.forEach(r => {
    const t = r.type || 'Class';
    if (!perType[t]) perType[t] = { total: 0, skipped: 0 };
    perType[t].total++;
    if (r.skipped) perType[t].skipped++;
  });
  const maxType = Math.max(1, ...Object.values(perType).map(v => v.skipped));
  const barRows = Object.entries(perType).map(([name, v]) => {
    const width = (v.skipped / maxType) * 100;
    const grad = v.skipped === 0 ? 'linear-gradient(90deg, #86ab7a, #a3c497)' : v.skipped >= maxType ? 'linear-gradient(90deg, #d4745e, #e09070)' : 'linear-gradient(90deg, #e09a4e, #eab873)';
    return `<div class="bar-row"><div class="bar-label">${esc(name)}</div><div class="bar-track"><div class="bar-fill" style="width:${width}%;background:${grad}">${v.skipped > 0 ? v.skipped : ''}</div></div><div class="bar-val">${v.skipped}/${v.total}</div></div>`;
  }).join('');

  const heat = ALL_DATES.map(date => {
    const n = schedule.skipped.filter(s => s.date === date).length;
    const cls = n === 0 ? 'zero' : n >= 2 ? 'high' : 'low';
    return `<div class="heat-day ${cls}"><div class="d">${fmtDate(date)}</div><div class="n">${n}</div></div>`;
  }).join('');

  const skippedLog = schedule.skipped.slice().sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start).map(s => `
    <div class="skip-item">
      <div class="row between wrap" style="align-items: flex-start">
        <div style="flex: 1">
          <div class="name">${esc(s.className)}</div>
          <div class="meta">${fmtDateLong(s.date)} · ${fmtRange(s.start, s.end)} · ${esc(s.floor || '')} ${esc(s.room || '')}</div>
        </div>
        <span class="pill coral">skip</span>
      </div>
      ${s.topic ? `<div class="topic"><strong>Missed:</strong> ${esc(s.topic)}</div>` : ''}
      <button class="status-btn ${s.status === 'done' ? 'done' : ''}" onclick="toggleCatchup('${s.id}')">${s.status === 'done' ? '✓ Caught up' : 'Mark as caught up'}</button>
    </div>
  `).join('');

  const attendanceSplit = [
    { name:'Attended', amount: totalAttend, color:'#86ab7a' },
    { name:'Skipped', amount: totalSkip, color:'#d4745e' }
  ];

  const uniInsights = [];
  if (pending >= 2) uniInsights.push({ pri: 0, importance:'critical', type:'bad', icon:'⚠️', html:`<strong>${pending} skipped sessions</strong> still need catch-up.` });
  else if (pending === 1) uniInsights.push({ pri: 1, importance:'important', type:'warn', icon:'📘', html:`<strong>1 session</strong> left to catch up on.` });
  else uniInsights.push({ pri: 2, importance:'normal', type:'good', icon:'✅', html:`All skipped sessions have been caught up.` });
  uniInsights.push({ pri: 2, importance:'normal', type:'good', icon:'🎯', html:`Attendance rate: <strong>${Math.round((totalAttend / CLASSES.length) * 100)}%</strong>.` });
  uniInsights.sort((a, b) => a.pri - b.pri);

  document.getElementById('view-uni').innerHTML = `
    <div class="grid g-4 stagger" style="margin-bottom: 20px">
      <div class="card stat-card">
